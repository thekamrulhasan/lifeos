# Run Edi Life OS with MySQL:
#   cp .env.example .env   (then set your sign-in and passwords; initial sign-in values are needed only on first setup)
#   docker compose up -d
# Open http://localhost:8080
services:
  app:
    build: .
    image: lifeos
    container_name: lifeos_app
    restart: always
    ports:
      - "${LIFEOS_PORT:-8784}:80"
    environment:
      LIFEOS_DB_HOST: db
      LIFEOS_DB_NAME: thedukelifeosdb
      LIFEOS_DB_USER: thedukelifeosman
      LIFEOS_DB_PASSWORD: ${LIFEOS_DB_PASSWORD:?}
      LIFEOS_USERNAME: ${LIFEOS_USERNAME:-}
      LIFEOS_PASSWORD: ${LIFEOS_PASSWORD:-}
      LIFEOS_API_TOKEN: ${LIFEOS_API_TOKEN:-}
      LIFEOS_TRUST_PROXY: ${LIFEOS_TRUST_PROXY:-false}
      LIFEOS_TIMEZONE: ${LIFEOS_TIMEZONE:-Asia/Dhaka}
      LIFEOS_WEATHER_LATITUDE: ${LIFEOS_WEATHER_LATITUDE:-23.7808}
      LIFEOS_WEATHER_LONGITUDE: ${LIFEOS_WEATHER_LONGITUDE:-90.4074}
      LIFEOS_WEATHER_LOCATION: ${LIFEOS_WEATHER_LOCATION:-Mohakhali, Dhaka}
      TZ: ${LIFEOS_TIMEZONE:-Asia/Tehran}
    volumes:
      - ./attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://localhost/login.php') === false ? 1 : 0);\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  db:
    image: mysql:8.4
    container_name: lifeos_db
    restart: always 
    environment:
      MYSQL_DATABASE: thedukelifeosdb
      MYSQL_USER: thedukelifeosman
      MYSQL_PASSWORD: ${LIFEOS_DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${LIFEOS_DB_ROOT_PASSWORD:?}
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u lifeos -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql:
  attachments:
